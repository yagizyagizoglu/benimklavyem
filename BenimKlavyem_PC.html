<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benim Klavyem - PC</title>
<style>
:root{--bg:#0f1420;--card:#1a2233;--ink:#eaf0ff;--mute:#8fa0c0;--line:#2a3550;--acc:#4f8cff;--ok:#4fd1a1;--bad:#ff6b8b;--pin:#ffd166}
:root.light{--bg:#f2f5fb;--card:#fff;--ink:#14203a;--mute:#5d6b88;--line:#d5dcec;--acc:#2f6df0;--pin:#c98a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 8px 0 0}
.tabs{display:flex;gap:6px}
button,.btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:3px 9px;font-size:13px}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
.sp{flex:1}
input[type=search],input[type=text],textarea{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
textarea{resize:vertical;min-height:90px}
main{max-width:900px;margin:0 auto;padding:14px 16px 60px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.item.drag{opacity:.4}
.item.over{border-color:var(--acc)}
.title{font-weight:700;color:var(--pin);margin-bottom:2px}
.txt{white-space:pre-wrap;word-break:break-word;cursor:pointer;max-height:9em;overflow:auto}
.meta{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.meta .t{color:var(--mute);font-size:12px;margin-right:auto}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.hint{color:var(--mute);font-size:13px;margin:0 0 12px}
.grip{cursor:grab;color:var(--mute);font-size:18px;user-select:none;padding:0 4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--acc);color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style></head><body>
<header>
  <h1>⌨ Benim Klavyem</h1>
  <div class="tabs">
    <button id="tab-hist" class="on" onclick="setTab('hist')">Pano</button>
    <button id="tab-pins" onclick="setTab('pins')">Sabitler</button>
    <button id="tab-tr" onclick="setTab('tr')">Çeviri</button>
  </div>
  <span class="sp"></span>
  <button class="sm" onclick="exportJson()">⬇ Verileri indir</button>
  <button class="sm" onclick="document.getElementById('imp').click()">⬆ Veri yükle</button>
  <input type="file" id="imp" accept=".json" hidden>
  <button class="sm" id="themeBtn" onclick="toggleTheme()">☀</button>
</header>
<main>
  <section id="v-hist">
    <div class="bar">
      <input type="search" id="q1" placeholder="Ara…" oninput="render()">
      <button onclick="pasteClip()">📋 Panodan ekle</button>
      <button class="danger" onclick="clearHist()">Geçmişi temizle</button>
    </div>
    <p class="hint">Bu sayfa açıkken kopyaladığın metinler otomatik eklenir (sayfaya her dönüşte pano da okunur; tarayıcı izin sorarsa "İzin ver" de). En fazla 30 kayıt tutulur. Metne dokunmak kopyalar.</p>
    <div id="hist"></div>
  </section>
  <section id="v-pins" hidden>
    <div class="bar">
      <input type="search" id="q2" placeholder="Sabitlerde ara…" oninput="render()">
    </div>
    <textarea id="newPin" placeholder="Yeni sabit not yaz…"></textarea>
    <div class="row"><input type="text" id="newTitle" placeholder="Başlık (isteğe bağlı)" style="flex:1"><button class="on" onclick="addPin()">★ Sabit ekle</button></div>
    <p class="hint" style="margin-top:12px">Sırayı ≡ tutamacıyla sürükleyerek değiştir.</p>
    <div id="pins"></div>
  </section>
  <section id="v-tr" hidden>
    <textarea id="trText" placeholder="Çevrilecek metin…"></textarea>
    <div class="row">
      <button class="on" onclick="gt('tr','en')">Türkçe → İngilizce</button>
      <button class="on" onclick="gt('en','tr')">İngilizce → Türkçe</button>
      <button onclick="gt('auto','tr')">Otomatik → Türkçe</button>
    </div>
    <p class="hint">Google Çeviri yeni sekmede açılır.</p>
  </section>
</main>
<div id="toast"></div>
<script>
const MAX=30;
let S;
function load(){try{S=JSON.parse(localStorage.getItem('bk_pc')||'null')}catch(e){S=null}
  if(!S||typeof S!=='object')S={};
  S.history=Array.isArray(S.history)?S.history:[];S.pinned=Array.isArray(S.pinned)?S.pinned:[];
  S.titles=S.titles||{};S.times=S.times||{};S.theme=S.theme||'dark'}
function save(){try{localStorage.setItem('bk_pc',JSON.stringify(S))}catch(e){}}
load();
let tab='hist';
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1500)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setTab(t){tab=t;['hist','pins','tr'].forEach(k=>{$('v-'+k).hidden=k!==t;$('tab-'+k).classList.toggle('on',k===t)});render()}
function fmt(ms){if(!ms)return'';const d=new Date(ms);return d.toLocaleDateString('tr')+' '+d.toLocaleTimeString('tr',{hour:'2-digit',minute:'2-digit'})}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}lastSeen=t;toast('Kopyalandı')}
function addHist(t){t=(t||'').trim();if(!t)return false;
  const i=S.history.indexOf(t);if(i>=0)S.history.splice(i,1);
  S.history.unshift(t);S.times[t]=Date.now();
  while(S.history.length>MAX){const x=S.history.pop();if(!S.pinned.includes(x))delete S.times[x]}
  save();return true}
function pin(t){if(!S.pinned.includes(t)){S.pinned.unshift(t);save();toast('Sabitlendi');render()}}
function unpin(t){S.pinned=S.pinned.filter(x=>x!==t);delete S.titles[t];save();render()}
function delHist(t){S.history=S.history.filter(x=>x!==t);save();render()}
function clearHist(){if(confirm('Pano geçmişi silinsin mi? (Sabitler kalır)')){S.history=[];save();render()}}
function addPin(){const t=$('newPin').value.trim();if(!t)return;const ti=$('newTitle').value.trim();
  if(!S.pinned.includes(t))S.pinned.unshift(t);if(ti)S.titles[t]=ti;save();$('newPin').value='';$('newTitle').value='';render()}
function editTitle(t){const v=prompt('Başlık (boş = kaldır):',S.titles[t]||'');if(v===null)return;const c=v.replace(/\n/g,' ').trim();if(c)S.titles[t]=c;else delete S.titles[t];save();render()}
function editText(t){const v=prompt('Notu düzenle:',t);if(v===null||!v.trim()||v===t)return;const n=v.trim();
  const i=S.pinned.indexOf(t);if(i<0)return;if(S.pinned.includes(n)&&n!==t){toast('Aynı not zaten var');return}
  S.pinned[i]=n;if(S.titles[t]){S.titles[n]=S.titles[t];delete S.titles[t]}save();render()}
let lastSeen=null;
async function pasteClip(auto){try{const t=await navigator.clipboard.readText();
  if(t&&t.trim()&&t!==lastSeen){lastSeen=t;if(addHist(t)){render();if(!auto)toast('Eklendi')}}else if(!auto)toast('Pano boş ya da zaten ekli')}
  catch(e){if(!auto)toast('Panoya erişim izni verilmedi')}}
document.addEventListener('copy',()=>setTimeout(()=>{const s=String(getSelection());if(s&&s.trim()&&!document.activeElement.matches('#q1,#q2')){}},0));
document.addEventListener('paste',e=>{const t=e.clipboardData&&e.clipboardData.getData('text');if(t&&!e.target.matches('input,textarea')){lastSeen=t;addHist(t);render();toast('Eklendi')}});
window.addEventListener('focus',()=>pasteClip(true));
function card(t,pinnedView){
  const ti=S.titles[t];const tm=fmt(S.times[t]);
  return `<div class="item" ${pinnedView?'draggable="true"':''} data-t="${encodeURIComponent(t)}">
  ${ti?`<div class="title">${esc(ti)}</div>`:''}
  <div class="txt" data-act="copy">${esc(t)}</div>
  <div class="meta">${pinnedView?'<span class="grip" title="Sürükle">≡</span>':''}<span class="t">${tm}</span>
  <button class="sm" data-act="copy">Kopyala</button>
  ${pinnedView?`<button class="sm" data-act="title">Başlık</button><button class="sm" data-act="edit">Düzenle</button><button class="sm danger" data-act="unpin">Sabiti kaldır</button>`
  :`${S.pinned.includes(t)?'<span class="t" style="margin:0">★ sabit</span>':'<button class="sm" data-act="pin">☆ Sabitle</button>'}<button class="sm danger" data-act="del">Sil</button>`}
  </div></div>`}
function render(){
  const q1=$('q1').value.toLowerCase(),q2=$('q2').value.toLowerCase();
  if(tab==='hist'){const l=S.history.filter(t=>t.toLowerCase().includes(q1));
    $('hist').innerHTML=l.length?l.map(t=>card(t,false)).join(''):'<div class="empty">Geçmiş boş. Bir metin kopyala ve bu sayfaya dön.</div>'}
  if(tab==='pins'){const l=S.pinned.filter(t=>(t+' '+(S.titles[t]||'')).toLowerCase().includes(q2));
    $('pins').innerHTML=l.length?l.map(t=>card(t,true)).join(''):'<div class="empty">Sabit not yok.</div>'}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
  const it=b.closest('.item');const t=decodeURIComponent(it.dataset.t);const a=b.dataset.act;
  if(a==='copy')copy(t);else if(a==='pin')pin(t);else if(a==='unpin')unpin(t);else if(a==='del')delHist(t);
  else if(a==='title')editTitle(t);else if(a==='edit')editText(t)});
// sürükle-bırak sıralama
let dragT=null;
$('pins').addEventListener('dragstart',e=>{const it=e.target.closest('.item');if(!it)return;dragT=decodeURIComponent(it.dataset.t);it.classList.add('drag')});
$('pins').addEventListener('dragend',()=>{dragT=null;render()});
$('pins').addEventListener('dragover',e=>{e.preventDefault();const it=e.target.closest('.item');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));if(it)it.classList.add('over')});
$('pins').addEventListener('drop',e=>{e.preventDefault();const it=e.target.closest('.item');if(!it||dragT==null)return;
  const to=decodeURIComponent(it.dataset.t);if(to===dragT)return;
  const a=S.pinned.filter(x=>x!==dragT);const i=a.indexOf(to);a.splice(i,0,dragT);S.pinned=a;save();render()});
function gt(sl,tl){const t=$('trText').value.trim();if(!t){toast('Önce metin yaz');return}
  window.open('https://translate.google.com/?sl='+sl+'&tl='+tl+'&text='+encodeURIComponent(t)+'&op=translate','_blank','noopener')}
// yedek: telefon klavyesinin yedek biçimiyle uyumlu (clips.history / pinned / titles)
function exportJson(){const o={app:'MyKeyboard',savedAt:new Date().toISOString().replace('T',' ').slice(0,19),
  clips:{history:JSON.stringify(S.history),pinned:JSON.stringify(S.pinned),titles:JSON.stringify(S.titles),htimes:JSON.stringify(S.times)},ui:{}};
  const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);const d=new Date(),p=n=>String(n).padStart(2,'0');
  a.download=`MYKEYBOARDYEDEK_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}_PC.json`;a.click();URL.revokeObjectURL(a.href)}
$('imp').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const o=JSON.parse(await f.text());const c=o.clips||{};
    const arr=v=>{try{const x=typeof v==='string'?JSON.parse(v):v;return Array.isArray(x)?x.map(String):[]}catch(_){return[]}};
    const obj=v=>{try{const x=typeof v==='string'?JSON.parse(v):v;return x&&typeof x==='object'?x:{}}catch(_){return{}}};
    const h=arr(c.history),p=arr(c.pinned),ti=obj(c.titles),tm=obj(c.htimes);
    if(!h.length&&!p.length)throw 0;
    if(!confirm(`İçe aktarılsın mı? ${h.length} geçmiş, ${p.length} sabit. Mevcut verilerin yerine geçer.`))return;
    S.history=h.slice(0,MAX);S.pinned=p;S.titles=ti;S.times=tm;save();render();toast('Yüklendi')}
  catch(_){alert('Geçerli bir klavye yedek dosyası değil.')}});
function toggleTheme(){S.theme=S.theme==='light'?'dark':'light';save();applyTheme()}
function applyTheme(){document.documentElement.classList.toggle('light',S.theme==='light');$('themeBtn').textContent=S.theme==='light'?'🌙':'☀'}
applyTheme();render();pasteClip(true);
</script></body></html>
